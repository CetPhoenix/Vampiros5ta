<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vampiro V5 - Companion App | Nexo Alpha</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 15px;
    }
    .app-container {
      max-width: 500px;
      margin: 0 auto;
      background: #121212;
      border: 1px solid #2a2a2a;
      border-top: 4px solid #900c3f;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(144, 12, 63, 0.3);
    }
    h1, h2 {
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      color: #900c3f;
      text-align: center;
      margin-top: 0;
      letter-spacing: 1px;
    }
    .section-title {
      color: #d35400;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
      margin-top: 20px;
      margin-bottom: 15px;
      font-size: 1.1em;
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }
    .control-group {
      flex: 1;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2a2a2a;
      text-align: center;
    }
    label {
      display: block;
      font-size: 0.85em;
      color: #aaa;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    input[type="number"] {
      width: 100%;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      font-size: 1.4em;
      text-align: center;
      border-radius: 4px;
      padding: 5px 0;
      box-sizing: border-box;
    }
    .btn-container {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-roll {
      flex: 2;
      background: linear-gradient(180deg, #900c3f 0%, #58001d 100%);
      color: #fff;
      border: none;
      padding: 12px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.2em;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1.5px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    .btn-rouse {
      flex: 1;
      background: linear-gradient(180deg, #d35400 0%, #8e3200 100%);
      color: #fff;
      border: none;
      padding: 12px;
      font-family: 'Oswald', sans-serif;
      font-size: 1em;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }
    .btn-roll:active, .btn-rouse:active {
      transform: scale(0.98);
    }
    .results-box {
      margin-top: 15px;
      background: #181818;
      border: 1px solid #282828;
      border-radius: 6px;
      padding: 15px;
      min-height: 80px;
    }
    .dice-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      justify-content: center;
    }
    .die {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2em;
      border-radius: 6px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .die-rolling {
      animation: shake 0.3s ease-in-out infinite;
    }
    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      75% { transform: rotate(-10deg); }
      100% { transform: rotate(0deg); }
    }
    .die-normal { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    .die-hunger { background: #900c3f; color: #fff; border: 1px solid #ff2e63; }
    .die-success { border-color: #27ae60; box-shadow: 0 0 8px rgba(39, 174, 96, 0.6); }
    
    .status-msg {
      font-family: 'Oswald', sans-serif;
      font-size: 1.2em;
      margin-top: 10px;
      text-align: center;
    }
    .text-success { color: #2ecc71; }
    .text-bestial { color: #e74c3c; text-shadow: 0 0 8px #900c3f; }
    .text-fail { color: #e67e22; }

    /* TRACKERS Y CONTADORES */
    .tracker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tracker-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
    }
    .tracker-cells {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 8px;
    }
    .cell-btn {
      width: 26px;
      height: 26px;
      background: #000;
      border: 1px solid #444;
      color: #d35400;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9em;
      user-select: none;
    }
    .hunger-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-step {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* DESPLEGABLES / ACCORDION */
    details {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      margin-bottom: 8px;
      padding: 8px 12px;
    }

      cursor: pointer;
      text-transform: uppercase;
      font-size:
