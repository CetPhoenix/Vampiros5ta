<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vampiro V5 - Companion App | Nexo Alpha</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 15px;
    }
    .app-container {
      max-width: 500px;
      margin: 0 auto;
      background: #121212;
      border: 1px solid #2a2a2a;
      border-top: 4px solid #900c3f;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(144, 12, 63, 0.3);
    }
    h1, h2 {
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      color: #900c3f;
      text-align: center;
      margin-top: 0;
      letter-spacing: 1px;
    }
    .section-title {
      color: #d35400;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
      margin-top: 20px;
      font-size: 1.1em;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }
    .control-group {
      flex: 1;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2a2a2a;
      text-align: center;
    }
    label {
      display: block;
      font-size: 0.85em;
      color: #aaa;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    input[type="number"] {
      width: 100%;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      font-size: 1.4em;
      text-align: center;
      border-radius: 4px;
      padding: 5px 0;
      box-sizing: border-box;
    }
    .btn-roll {
      width: 100%;
      background: linear-gradient(180deg, #900c3f 0%, #58001d 100%);
      color: #fff;
      border: none;
      padding: 12px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.2em;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1.5px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    .btn-roll:active {
      transform: scale(0.98);
    }
    .results-box {
      margin-top: 20px;
      background: #181818;
      border: 1px solid #282828;
      border-radius: 6px;
      padding: 15px;
      min-height: 80px;
    }
    .dice-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .die {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1em;
      border-radius: 4px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }
    .die-normal { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    .die-hunger { background: #900c3f; color: #fff; border: 1px solid #ff2e63; }
    .die-success { border-color: #27ae60; }
    .status-msg {
      font-family: 'Oswald', sans-serif;
      font-size: 1.2em;
      margin-top: 10px;
      text-align: center;
    }
    .text-success { color: #2ecc71; }
    .text-bestial { color: #e74c3c; text-shadow: 0 0 8px #900c3f; }
    .text-fail { color: #e67e22; }
  </style>
</head>
<body>

<div class="app-container">
  <h1>🩸 Vampire V5 Roller</h1>

  <!-- CONTROLES DE DADOS -->
  <div class="controls">
    <div class="control-group">
      <label>Reserva Total</label>
      <input type="number" id="dicePool" value="6" min="1" max="20">
    </div>
    <div class="control-group">
      <label>Ansia (Hunger)</label>
      <input type="number" id="hungerPool" value="1" min="0" max="5">
    </div>
  </div>

  <button class="btn-roll" onclick="rollV5Dice()">Tirar Dados 🎲</button>

  <!-- RESULTADOS DE LA TIRADA -->
  <div class="results-box">
    <div id="summary" style="font-weight: bold; font-size: 1.1em;">Tira los dados para ver el resultado...</div>
    <div id="status" class="status-msg"></div>
    <div id="diceArea" class="dice-container"></div>
  </div>
</div>

<script>
function rollV5Dice() {
  const pool = parseInt(document.getElementById('dicePool').value) || 1;
  const hunger = Math.min(parseInt(document.getElementById('hungerPool').value) || 0, pool);
  
  const normalDiceCount = Math.max(0, pool - hunger);
  const hungerDiceCount = hunger;

  let normalResults = [];
  let hungerResults = [];
  let successes = 0;
  let normalTens = 0;
  let hungerTens = 0;
  let hungerOnes = 0;

  // Tirar dados normales
  for (let i = 0; i < normalDiceCount; i++) {
    let val = Math.floor(Math.random() * 10) + 1;
    normalResults.push(val);
    if (val >= 6) successes++;
    if (val === 10) normalTens++;
  }

  // Tirar dados de Ansia
  for (let i = 0; i < hungerDiceCount; i++) {
    let val = Math.floor(Math.random() * 10) + 1;
    hungerResults.push(val);
    if (val >= 6) successes++;
    if (val === 10) hungerTens++;
    if (val === 1) hungerOnes++;
  }

  // Calcular Críticos (Cada par de 10s suma 2 éxitos extra, totalizando 4)
  const totalTens = normalTens + hungerTens;
  const criticalPairs = Math.floor(totalTens / 2);
  const totalSuccesses = successes + (criticalPairs * 2);

  // Renderizar dados
  const diceArea = document.getElementById('diceArea');
  diceArea.innerHTML = '';

  normalResults.forEach(res => {
    let d = document.createElement('div');
    d.className = 'die die-normal' + (res >= 6 ? ' die-success' : '');
    d.innerText = res;
    diceArea.appendChild(d);
  });

  hungerResults.forEach(res => {
    let d = document.createElement('div');
    d.className = 'die die-hunger' + (res >= 6 ? ' die-success' : '');
    d.innerText = res;
    diceArea.appendChild(d);
  });

  // Mensajes de Estado
  const summary = document.getElementById('summary');
  const status = document.getElementById('status');
  
  summary.innerHTML = `Éxitos totales: <span style="color:#d35400; font-size:1.3em;">${totalSuccesses}</span>`;

  if (criticalPairs > 0 && hungerTens > 0) {
    status.className = "status-msg text-bestial";
    status.innerText = "💥 ¡ÉXITO BESTIAL! La Bestia toma el control.";
  } else if (totalSuccesses === 0 && hungerOnes > 0) {
    status.className = "status-msg text-bestial";
    status.innerText = "💀 ¡FALLO BESTIAL / COMPULSIÓN!";
  } else if (criticalPairs > 0) {
    status.className = "status-msg text-success";
    status.innerText = "✨ ¡Éxito Crítico!";
  } else if (totalSuccesses > 0) {
    status.className = "status-msg text-success";
    status.innerText = "Éxito conseguido.";
  } else {
    status.className = "status-msg text-fail";
    status.innerText = "Fallo en la tirada.";
  }
}
</script>

</body>
</html>
